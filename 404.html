<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirigiendo...</title>
  <script>
    // Captura la ruta actual (ej: /contact)
    var path = window.location.pathname;
    var search = window.location.search;
    
    // Redirige a la raíz con la ruta codificada como parámetro
    // Ejemplo: /contact -> /?p=/contact
    if (path && path !== '/') {
      window.location.replace(
        window.location.origin + '/?p=' + encodeURIComponent(path + search)
      );
    } else {
      // Si es la raíz, solo carga normal
      window.location.replace(window.location.origin);
    }
  </script>
</head>
<body></body>
</html>
