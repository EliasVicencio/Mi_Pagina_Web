<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elías Vicencio · Analista Programador</title>
  <meta name="description" content="Portafolio de Elías Vicencio, analista programador: desarrollo web, Python, ciberseguridad e ISO 27001.">
  <meta name="theme-color" content="#0b1020">
  <link rel="canonical" href="https://eliasvicencio.cl/">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="utils/theme.js"></script>
  <!-- Aplica el tema antes de pintar (evita el parpadeo). Antes era js/theme.js -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
